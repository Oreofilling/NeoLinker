name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build:
        description: 'Also build the Windows release artifact'
        type: boolean
        default: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the build box toolchain. flutter analyze defaults to
          # --fatal-infos, and Flutter 3.48+ deprecates
          # package:flutter/material.dart (material_ui migration is still a
          # preview), so floating stable fails CI on infos the shipped
          # 3.47.8 binaries never see.
          flutter-version: 3.47.8
          cache: true
      - name: analyze + test
        shell: bash
        run: bash tool/ci.sh check
      - name: build windows (release)
        # Full builds run on version tags and manual dispatch only;
        # ordinary pushes and PRs stop at analyze + test.
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.build)
        shell: bash
        run: bash tool/ci.sh build
      - name: upload windows build
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.build)
        uses: actions/upload-artifact@v4
        with:
          name: neolinker-windows-x64
          path: apps/desktop_app/build/windows/x64/runner/Release/
          if-no-files-found: warn
